# Procesa las solicitudes de la app del celular: cada push que trae un
# solicitudes/<id>/solicitud.json genera la vista previa o la cotización emitida y deja el
# resultado en solicitudes/<id>/salida/. Ver herramientas/procesar_solicitud.py.
name: Solicitudes de cotización

on:
  push:
    branches: [main]
    paths: ["solicitudes/**/solicitud.json"]
  workflow_dispatch:

# Una a la vez: dos emisiones simultáneas tomarían el mismo N°.
concurrency:
  group: solicitudes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Las mismas fuentes con que se calibró la plantilla (Arial -> Liberation Sans,
      # Georgia -> DejaVu Serif): con otras, el título y la cápsula del N° se corren.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Procesar solicitudes pendientes
        run: python herramientas/procesar_solicitud.py
      - name: Guardar resultados
        run: |
          git config user.name "cotizaciones-bot"
          git config user.email "cotizaciones-bot@users.noreply.github.com"
          git add solicitudes cotizaciones-emitidas
          git diff --cached --quiet && exit 0
          git commit -m "Procesa solicitudes de la app"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
